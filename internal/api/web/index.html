            <button class="sponsor-switch ${fullAuto ? "on" : ""}" type="button" role="switch" aria-checked="${fullAuto}" aria-label="${t("Run agents in {name} without permission prompts", { name: escapeHTML(space.name) })}" data-action="toggle-fullauto" data-space="${escapeHTML(space.name)}" ${fullAutoBusy ? "disabled" : ""}><span class="sponsor-knob"></span></button>
          </div></div>
          <span class="hint" style="font-size:11.5px;color:#94A3B8">${t("This space's switches are saved independently. A provider also has to be on under AI for all spaces on the overview.")}</span>
        </div>`;
    }

    function formatUSD(n) { return "$" + (Number(n) || 0).toFixed(2); }

    function renderExecution(space) {
      const options = state.codexOptions;
      const route = space.codex_route || "official";
      const model = space.codex_model || "gpt-5.6-sol";
      const online = space.network_mode !== "gateway-only";
      const busy = !!state.busy || !!space.network_upgrading;
      const models = options.models.includes(model) ? options.models : options.models.concat(model);
      const modelLabel = m => ({"gpt-6-astra":"GPT-6 Astra", "gpt-5.6-sol":"GPT-5.6 Sol", "gpt-5.6-terra":"GPT-5.6 Terra", "gpt-5.6-luna":"GPT-5.6 Luna"})[m] || m;
      return `<section class="card resources-card ${animationClass(4)}" aria-label="${t("Model and network settings")}">
        <span class="card-heading">${t("Model &amp; network")}</span>
        <label class="field-group"><span class="label">${t("Codex account")}</span>
          <select class="field" aria-label="${t("Codex account")}" data-setting="codex-route" data-space="${escapeHTML(space.name)}" ${busy ? "disabled" : ""}>
            ${options.routes.map(r => `<option value="${escapeHTML(r.id)}" ${r.id === route ? "selected" : ""} ${!r.configured ? "disabled" : ""}>${escapeHTML(r.label)}${r.configured ? "" : t(" · not configured")}</option>`).join("")}
          </select>
        </label>
        <label class="field-group"><span class="label">${t("Default Codex model")}</span>
          <select class="field" aria-label="${t("Default Codex model")}" data-setting="codex-model" data-space="${escapeHTML(space.name)}" ${busy ? "disabled" : ""}>
            ${models.map(m => `<option value="${escapeHTML(m)}" ${m === model ? "selected" : ""}>${escapeHTML(modelLabel(m))}</option>`).join("")}
          </select>
        </label>
        <span class="hint" style="font-size:11.5px;color:#64748B">${t("Account changes apply to new requests. Start a new Codex session to use the selected default model.")}</span>
        <div class="space-provider-row" style="border-top:1px solid #F1F5F9;padding-top:16px">
          <div class="space-provider-copy"><span class="space-provider-name">${t("Internet access")}</span>
            <span class="space-provider-state ${online ? "active" : ""}">${online ? t("Browsing, downloads and package installs allowed") : t("AI gateway only · external browsing and downloads blocked")}</span>
          </div>
          <button class="sponsor-switch ${online ? "on" : ""}" type="button" role="switch" aria-checked="${online}" aria-label="${t("Internet access in {name}", { name: escapeHTML(space.name) })}" data-action="toggle-network" data-space="${escapeHTML(space.name)}" ${busy || !space.network_control_ready || !spaceIsAwake(space) ? "disabled" : ""}><span class="sponsor-knob"></span></button>
        </div>
        ${!space.network_control_ready ? `<button class="btn-ghost" type="button" data-action="open-network-upgrade" data-space="${escapeHTML(space.name)}" ${busy ? "disabled" : ""}>${t("Enable network controls…")}</button>` : ""}
        <span class="hint" style="font-size:11.5px;color:#64748B">${space.network_upgrading ? t("Saving snapshot and upgrading… You can leave this page and return.") : !spaceIsAwake(space) ? t("Wake this space to change Internet access.") : state.busy === `network:${space.name}` ? t("Applying network policy…") : t("AI calls and SSH remain available when Internet access is off. Restart agents after changing network access.")}</span>
        ${space.network_upgrade_error ? `<span class="hint" role="alert" style="color:#B91C1C">${escapeHTML(space.network_upgrade_error)}</span>` : ""}
      </section>`;
    }

    function renderBudget(space) {
      const spent = Number(space.spent_usd || 0);
      const limit = Number(space.usd_limit || 0);
      const conc = Number(space.max_concurrency || 0);
      let usageLine;
      if (limit > 0) {
        const percent = Math.min(100, Math.max(0, Math.round(spent / limit * 100)));
        const over = spent >= limit;
        usageLine = `
          <div class="resource-block">
            <div class="resource-line"><span>${t("Spent")}</span><span class="mono num">${formatUSD(spent)} / ${formatUSD(limit)}</span></div>
            <div class="meter"><div class="meter-fill" style="width:${percent}%;${over ? "background:#DC2626" : ""}"></div></div>
            ${over ? `<span class="hint" style="font-size:11.5px;color:#DC2626">${t("Spend limit reached — new requests are refused.")}</span>` : ""}
          </div>`;
      } else {
        usageLine = `<div class="resource-line"><span>${t("Spent")}</span><span class="mono num">${formatUSD(spent)} <span style="color:#94A3B8">${t("· no cap")}</span></span></div>`;
      }
      return `
        <div class="card resources-card ${animationClass(4)}">
          <span class="card-heading">${t("Budget")}</span>
          ${usageLine}
          <div class="resource-line"><span>${t("Max concurrent")}</span><span class="mono num">${formatNumber(conc)}</span></div>
          <div class="resource-line" style="margin-top:6px"><span></span><button class="text-button" style="opacity:.8" type="button" data-action="open-limits" data-space="${escapeHTML(space.name)}">${t("Edit limits…")}</button></div>
          <span class="hint" style="font-size:11.5px;color:#94A3B8">${t("Estimated token cost for this space, saved across restarts. Your account’s actual billing may differ.")}</span>
        </div>`;
    }

    function renderLimitsModal() {
      const space = state.spaces.find(r => r.name === state.limitsSpace);
      if (!space) return "";
      const limit = Number(space.usd_limit || 0);
      const conc = Number(space.max_concurrency || 0);
      const busy = state.busy === `limits:${space.name}`;
      return `
        <div class="modal-backdrop" data-action="close-modal">
          <form class="card modal create-modal ${state.animate ? "scale-in" : ""}" role="dialog" aria-modal="true" aria-labelledby="limits-title" data-form="limits">
            <div class="modal-head"><span class="modal-title" id="limits-title">${t("Limits · {name}", { name: escapeHTML(space.name) })}</span><button class="text-button modal-close" type="button" data-action="close-modal" aria-label="${t("Close")}">${icons.close}</button></div>
            <label class="field-group"><span class="label">${t("Spend cap (USD, 0 = no cap)")}</span><input class="field mono" id="limit-usd" name="usd" type="number" min="0" step="1" inputmode="decimal" value="${limit || ""}" placeholder="0"></label>
            <label class="field-group"><span class="label">${t("Max concurrent requests")}</span><input class="field mono" id="limit-conc" name="conc" type="number" min="1" step="1" inputmode="numeric" value="${conc || ""}" placeholder="5"></label>
            <div class="modal-actions"><button class="btn-ghost" type="button" data-action="close-modal">${t("Cancel")}</button><button class="btn-gold" type="submit" ${busy ? "disabled" : ""}>${busy ? t("Saving…") : t("Save")}</button></div>
          </form>
        </div>`;
    }

    function renderNetworkUpgradeModal() {
      const name = state.upgradeSpace;
      const busy = state.busy === `upgrade:${name}`;
      return `<div class="modal-backdrop" data-action="close-modal">
        <section class="card modal create-modal" role="dialog" aria-modal="true" aria-labelledby="network-upgrade-title">
          <div class="modal-head"><span class="modal-title" id="network-upgrade-title">${t("Enable network controls · {name}", { name: escapeHTML(name) })}</span></div>
          <p class="modal-copy">${t("This older space needs a one-time upgrade. CoSpace saves a full filesystem snapshot and keeps your workspace, installed tools and SSH identity.")}</p>
          <p class="modal-copy">${t("The space restarts during the upgrade. Save your work first: running programs stop and SSH sessions disconnect. Internet stays on until you switch it off.")}</p>
          <div class="modal-actions"><button class="btn-ghost" type="button" data-action="close-modal" ${busy ? "disabled" : ""}>${t("Cancel")}</button><button class="btn-gold" type="button" data-action="confirm-network-upgrade" data-space="${escapeHTML(name)}" ${busy ? "disabled" : ""}>${busy ? t("Saving snapshot and upgrading…") : t("Save snapshot & upgrade")}</button></div>
        </section></div>`;
    }

    function renderDeleteModal() {
      const name = state.deleteTarget;
      if (!name) return "";
      const space = state.spaces.find(r => r.name === name);
      const guests = space && Array.isArray(space.members) ? space.members.length : 0;
      const busy = state.busy === `delete:${name}`;
      return `
        <div class="modal-backdrop" data-action="close-modal">
          <section class="card modal delete-modal ${state.animate ? "scale-in" : ""}" role="alertdialog" aria-modal="true" aria-labelledby="delete-title">
            <div class="modal-head"><span class="modal-title" id="delete-title">${t("Delete {name}?", { name: `<span class="mono">${escapeHTML(name)}</span>` })}</span><button class="text-button modal-close" type="button" data-action="close-modal" aria-label="${t("Close")}">${icons.close}</button></div>
            <p class="modal-copy">${t("This permanently removes the space — its VM, workspace files, and usage history.")}${guests ? tp(guests, " {n} paired guest loses access immediately.", " {n} paired guests lose access immediately.") : ""}${t(" There is no undo.")}</p>
            <div class="modal-actions"><button class="btn-ghost" type="button" data-action="close-modal">${t("Cancel")}</button><button class="btn-danger" type="button" data-action="confirm-delete" data-space="${escapeHTML(name)}" ${busy ? "disabled" : ""}>${busy ? t("Deleting…") : t("Delete Space")}</button></div>
          </section>
        </div>`;
    }

    function renderDetail(space) {
      const awake = spaceIsAwake(space);
      const powerLabel = spacePowerLabel(space);
      const toggleBusy = state.busy === `toggle:${space.name}`;
      const deleting = state.busy === `delete:${space.name}`;
      return `
        <main class="page detail-page">
          <header class="detail-head ${animationClass(1)}">
            <div class="detail-title"><span class="detail-name mono">${escapeHTML(space.name)}</span><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill">${statusDot(space, true)}<span class="${awake ? "awake-text" : "asleep-text"}">${powerLabel}</span></span><span class="pill mono num" style="color:#64748B">${formatNumber(space.memory_gb)} GB · ${tp(space.cpus, "{n} CPU", "{n} CPUs")}</span></div></div>
            <div class="detail-actions">
              <button class="btn-ghost" type="button" data-action="toggle-space" data-space="${escapeHTML(space.name)}" aria-label="${awake ? t("Sleep {name} until the Host wakes it", { name: escapeHTML(space.name) }) : t("Wake {name}", { name: escapeHTML(space.name) })}" ${toggleBusy ? "disabled" : ""}>${toggleBusy ? t("Working…") : awake ? t("Sleep") : t("Wake")}</button>
              <button class="btn-gold" type="button" data-action="open-invite" data-space="${escapeHTML(space.name)}">${icons.invite} ${t("Invite a Guest")}</button>
            </div>
          </header>
          <div class="detail-grid">
            <div class="detail-column">${renderGuests(space)}${renderUsageChart()}${renderBudget(space)}</div>
            <div class="detail-column">${renderExecution(space)}${renderAccess(space)}${renderProviders(space)}</div>
          </div>
          <div class="detail-footer ${animationClass(5)}">
            <button class="btn-ghost" type="button" data-action="save-template" data-space="${escapeHTML(space.name)}" ${state.busy === `template:${space.name}` ? "disabled" : ""}>${state.busy === `template:${space.name}` ? t("Saving…") : state.templateSavedFor === space.name ? t("Saved as template ✓") : t("Save as Template")}</button>
            <button class="text-button danger" style="opacity:.75" type="button" data-action="delete-space" data-space="${escapeHTML(space.name)}" ${deleting ? "disabled" : ""}>${deleting ? t("Deleting…") : t("Delete Space…")}</button>
          </div>
        </main>`;
    }

    function renderCreateModal() {
      const space = state.newSpace;
      const templates = state.templates || [];
      const templateField = templates.length ? `
            <div class="field-group">
              <span class="label">${t("Template")}</span>
              <select class="field mono" id="new-space-template" name="template">
                <option value="">${t("Blank space")}</option>
                ${templates.map(t => `<option value="${escapeHTML(t.name)}" ${space.template === t.name ? "selected" : ""}>${escapeHTML(t.name)}</option>`).join("")}
              </select>
              ${space.template ? `<button class="text-button danger" style="align-self:flex-start;opacity:.75;font-size:12px" type="button" data-action="delete-template" data-template="${escapeHTML(space.template)}">${t("Delete this template")}</button>` : ""}
            </div>` : "";
      return `
        <div class="modal-backdrop" data-action="close-modal">
          <form class="card modal create-modal ${state.animate ? "scale-in" : ""}" role="dialog" aria-modal="true" aria-labelledby="create-title" data-form="create-space">
            <div class="modal-head"><span class="modal-title" id="create-title">${t("New Space")}</span><button class="text-button modal-close" type="button" data-action="close-modal" aria-label="${t("Close")}">${icons.close}</button></div>
            <label class="field-group"><span class="label">${t("Name")}</span><input class="field mono" id="new-space-name" name="name" placeholder="${t("e.g. acme-web")}" maxlength="31" autocomplete="off" spellcheck="false" value="${escapeHTML(space.name)}"></label>
            ${templateField}
            <div class="field-group">
              <span class="label">${t("Memory")}</span>
              <div class="segmented" role="group" aria-label="${t("Memory")}">${[1, 2, 4, 8].map(memory => `<button class="segment ${memory === space.memory_gb ? "active" : ""}" type="button" data-action="pick-memory" data-memory="${memory}" aria-pressed="${memory === space.memory_gb}">${memory} GB</button>`).join("")}</div>
            </div>
              ${space.template ? `<p class="modal-copy" style="font-size:12px;color:#94A3B8;margin:0">${t("AI selection, model, Internet access, budget, and full-auto come from the template; memory above still applies.")}</p>` : ""}
            <div class="modal-actions"><button class="btn-ghost" type="button" data-action="close-modal">${t("Cancel")}</button><button class="btn-gold" type="submit" ${state.busy === "create" ? "disabled" : ""}>${state.busy === "create" ? t("Creating…") : t("Create Space")}</button></div>
          </form>
        </div>`;
    }

    function highlightedInviteCommand(command, code) {
      const safeCommand = String(command || "");
      let sawCommand = false;
      return safeCommand.split(/(\s+)/).map(part => {
        if (/^\s+$/.test(part)) return escapeHTML(part);
        if (!sawCommand) {
          sawCommand = true;
          return `<span class="command-name">${escapeHTML(part)}</span>`;
        }
        if (code && part.includes(code)) {
          const index = part.indexOf(code);
          return `<span class="command-value">${escapeHTML(part.slice(0, index))}</span><span class="command-accent">${escapeHTML(code)}</span><span class="command-value">${escapeHTML(part.slice(index + code.length))}</span>`;
        }
        const tokenClass = part.startsWith("-") ? "command-flag" : "command-value";
        return `<span class="${tokenClass}">${escapeHTML(part)}</span>`;
      }).join("");
    }

    function renderInviteModal() {
      const spaceName = state.inviteSpace || "space";
      const invite = state.invite;
      const inviteLink = inviteLinkURL(invite);
      const windows = state.invitePlatform === "windows";
      const installCommand = guestInstallCommand(invite, state.invitePlatform);
      const prompt = windows ? "PS&gt;&nbsp;" : "$&nbsp;";
      const terminalShell = windows ? "powershell" : "bash";
      let terminalBody;
      if (state.inviteLoading) {
        terminalBody = `<div class="loading-line"><span class="spinner"></span><span>${t("Creating one-time invite…")}</span></div>`;
      } else if (!invite) {
        terminalBody = `<div class="loading-line"><span>${t("Invite unavailable.")}</span><button class="btn-ghost terminal-copy" type="button" data-action="retry-invite">${t("Try again")}</button></div>`;
      } else {
        const pairCmd = String(invite.command || "");
        const steps = [
          { label: escapeHTML(t("Install the guest tool — already have cospace? Skip to 2 (it tells you if an update is needed)")), html: escapeHTML(installCommand) },
          { label: escapeHTML(t("Pair with this space (one-time code) — a second computer of the same person adds  -name <another-name>")), html: highlightedInviteCommand(pairCmd, String(invite.code || "")) },
          { label: escapeHTML(t("You're in — reconnect with this anytime")), html: `<span class="command-name">ssh</span><span class="command-accent"> ${escapeHTML(spaceName)}</span>` }
        ];
        terminalBody = steps.map((step, index) => `
          <div class="invite-step line-in l${index + 1}">
            <div class="terminal-comment invite-step-label"># ${index + 1} · ${step.label}</div>
            <div class="invite-line"><span class="prompt">${prompt}</span><span class="cmd mono">${step.html}</span><button class="btn-ghost terminal-copy" type="button" data-action="copy-line" data-line="${index}">${state.copied === String(index) ? t("Copied") : t("Copy")}</button></div>
          </div>`).join("") + '<div class="line-in l3"><span class="cursor-blink"></span></div>';
      }
      return `
        <div class="modal-backdrop" data-action="close-modal">
          <section class="card modal ${state.animate ? "scale-in" : ""}" role="dialog" aria-modal="true" aria-labelledby="invite-title">
            <div class="modal-head"><span class="modal-title" id="invite-title">${t("Invite a guest to {name}", { name: `<span class="mono grad-text">${escapeHTML(spaceName)}</span>` })}</span><button class="text-button modal-close" type="button" data-action="close-modal" aria-label="${t("Close")}">${icons.close}</button></div>
            <p class="modal-copy">${t("Pick your guest's operating system, then send them the three steps — or <b>Copy all</b> and paste the lot into your chat. Nothing to sign up for.")}</p>
            <div class="segmented" role="group" aria-label="${t("Guest operating system")}">
              <button class="segment ${windows ? "" : "active"}" type="button" data-action="pick-invite-platform" data-platform="posix" aria-pressed="${!windows}">macOS / Linux</button>
              <button class="segment ${windows ? "active" : ""}" type="button" data-action="pick-invite-platform" data-platform="windows" aria-pressed="${windows}">Windows</button>
            </div>
            <div class="terminal">
              <div class="terminal-head">${renderTrafficLights()}<span class="terminal-title mono">invite — ${terminalShell}</span>${invite ? `<button class="btn-ghost terminal-copy" type="button" data-action="copy-invite">${state.copied === "all" ? t("Copied") : t("Copy all")}</button>` : ""}</div>
              <div class="terminal-body invite-terminal-body mono">${terminalBody}</div>
            </div>
            ${inviteLink ? `<div class="invite-link-row"><span class="invite-link-label">${t("Or send one link — same steps, with visuals:")}</span><span class="invite-link-url mono" title="${escapeHTML(inviteLink)}">${escapeHTML(inviteLink)}</span><button class="btn-ghost terminal-copy" type="button" data-action="copy-invite-link">${state.copied === "link" ? t("Copied") : t("Copy")}</button></div>` : ""}
            <p class="modal-copy" style="font-size:12.5px;color:#94A3B8;margin-top:2px">${t("Once they pair, they appear under <b>Guests</b> here — you don't need to do anything else. Cursor / VS Code work too: Remote-SSH → {name}.", { name: `<span class="mono">${escapeHTML(spaceName)}</span>` })}</p>
            <div class="invite-meta"><span class="pill mono">${t("one-time code")}</span>${invite ? `<span class="pill mono">${escapeHTML(expiryLabel(invite.expires_at))}</span>` : ""}<button class="btn-gold" type="button" data-action="close-modal">${t("Done")}</button></div>
          </section>
        </div>`;
    }

    function renderToast() {
      if (!state.toast) return "";
      return `<div class="toast" role="alert" aria-live="assertive"><span class="toast-icon">${icons.alert}</span><span class="toast-message">${escapeHTML(state.toast.message)}</span><button class="text-button toast-close" type="button" data-action="close-toast" aria-label="${t("Dismiss error")}">${icons.close}</button></div>`;
    }

    function render() {
      const active = document.activeElement;
      const activeId = active && active.id;
      const selection = active && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
      const selectedSpace = state.spaces.find(space => space.name === state.selected);
      const main = state.loading && !state.loaded
        ? renderLoadingPage()
        : state.selected === "all" || !selectedSpace
          ? renderAllSpaces()
          : renderDetail(selectedSpace);
      app.innerHTML = `
        <div class="app-shell">
          <div class="backdrop-wash"></div><div class="gold-orb orb-top"></div><div class="gold-orb orb-bottom"></div><div class="backdrop-grid"></div>
          ${renderSidebar()}
          <section class="content-shell">
            ${renderImageBanner()}${renderBatteryBanner()}<div class="content-scroll">${main}</div>
            ${state.modal === "create" ? renderCreateModal() : ""}${state.modal === "invite" ? renderInviteModal() : ""}${state.modal === "limits" ? renderLimitsModal() : ""}${state.modal === "delete" ? renderDeleteModal() : ""}${state.modal === "network-upgrade" ? renderNetworkUpgradeModal() : ""}
          </section>
          ${renderToast()}
        </div>`;
      if (activeId) {
        const replacement = document.getElementById(activeId);
        if (replacement) {
          replacement.focus({ preventScroll: true });
          if (selection && replacement.setSelectionRange) replacement.setSelectionRange(selection[0], selection[1]);
        }
      }
    }

    async function toggleSpace(spaceName) {
      const space = state.spaces.find(item => item.name === spaceName);
      if (!space) return;
      if (spaceIsMissing(space)) {
        showError(new Error(t("This space's VM no longer exists on this Mac. Delete the space, or recreate it and copy its workspace back.")));
        return;
      }
      const action = spaceIsAwake(space) ? "stop" : "start";
      setState({ busy: `toggle:${spaceName}` }, false);
      try {
        await request(`/api/spaces/${encodeURIComponent(spaceName)}/${action}`, { method: "POST" });
        await refreshAfterMutation();
      } catch (error) {
        showError(error);
      } finally {
        if (state.busy === `toggle:${spaceName}`) setState({ busy: null }, false);
      }
    }

    async function toggleProvider(spaceName, provider) {
      const space = (state.spaces || []).find(r => r.name === spaceName);
      if (!space) return;
      const current = Array.isArray(space.providers) ? space.providers.slice() : ["anthropic", "openai", "xai"];
      let next = current.includes(provider) ? current.filter(p => p !== provider) : current.concat(provider);
      const busy = `providers:${spaceName}`;
      setState({ busy }, false);
      try {
        await request(`/api/spaces/${encodeURIComponent(spaceName)}/providers`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ providers: next })
        });
        await refreshAfterMutation();
      } catch (error) {
        showError(error);
      } finally {
        if (state.busy === busy) setState({ busy: null }, false);
      }
    }

    async function toggleFullAuto(spaceName) {
      const space = (state.spaces || []).find(r => r.name === spaceName);
      if (!space) return;
      const busy = `fullauto:${spaceName}`;
      setState({ busy }, false);
      try {
        await request(`/api/spaces/${encodeURIComponent(spaceName)}/full_auto`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: !space.full_auto })
        });
        await refreshAfterMutation();
      } catch (error) {
        showError(error);
      } finally {
        if (state.busy === busy) setState({ busy: null }, false);
      }
    }

    async function saveCodexSetting(spaceName, setting, value) {
      if (state.busy) return;
      const space = state.spaces.find(s => s.name === spaceName);
      if (!space) return;
      const body = { route: setting === "codex-route" ? value : space.codex_route, model: setting === "codex-model" ? value : space.codex_model };
      setState({busy:`codex:${spaceName}`}, false);
      try {
        await request(`/api/spaces/${encodeURIComponent(spaceName)}/codex`, {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
        await refreshAfterMutation();
      } catch(error) { showError(error); }
      finally { setState({busy:null},false); }
    }

    async function upgradeNetwork(spaceName) {
      if (state.busy) return;
      setState({busy: `upgrade:${spaceName}`}, false);
      try {
        await request(`/api/spaces/${encodeURIComponent(spaceName)}/upgrade-network`, {method: "POST"});
        setState({modal: null}, false);
        await refreshOverview();
      } catch (error) { showError(error); }
      finally { setState({busy: null}, false); }
    }

    async function toggleNetwork(spaceName) {
      if (state.busy) return;
      const space = state.spaces.find(s => s.name === spaceName);
      if (!space) return;
      setState({busy:`network:${spaceName}`}, false);
      try {
        await request(`/api/spaces/${encodeURIComponent(spaceName)}/network`, {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({internet_access:space.network_mode === "gateway-only"})});
        await refreshAfterMutation();
      } catch(error) { showError(error); }
      finally { setState({busy:null},false); }
    }

    async function saveTemplate(spaceName) {
      const busy = `template:${spaceName}`;
      setState({ busy }, false);
      try {
        await request(`/api/templates/${encodeURIComponent(spaceName)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ from_space: spaceName })
        });
        setState({ busy: null, templateSavedFor: spaceName }, false);
        setTimeout(() => { if (state.templateSavedFor === spaceName) setState({ templateSavedFor: null }, false); }, 2200);
        await refreshAfterMutation();
      } catch (error) {
        setState({ busy: null }, false);
        showError(error);
      }
    }

    async function deleteTemplate(name) {
      try {
        await request(`/api/templates/${encodeURIComponent(name)}`, { method: "DELETE" });
        setState({ newSpace: { ...state.newSpace, template: "" } }, false);
        await refreshAfterMutation();
      } catch (error) {
        showError(error);
      }
    }

    async function saveLimits() {
      const spaceName = state.limitsSpace;
      if (!spaceName) return;
      const usdRaw = document.getElementById("limit-usd")?.value.trim() ?? "";
      const concRaw = document.getElementById("limit-conc")?.value.trim() ?? "";
      const body = {};
      body.usd_limit = usdRaw === "" ? 0 : Number(usdRaw);
      body.max_concurrency = concRaw === "" ? 0 : Number(concRaw);
      if (!Number.isFinite(body.usd_limit) || body.usd_limit < 0) { showError(new Error(t("Spend cap must be a number ≥ 0."))); return; }
      if (!Number.isFinite(body.max_concurrency) || body.max_concurrency < 0) { showError(new Error(t("Concurrency must be a whole number ≥ 0."))); return; }
      const busy = `limits:${spaceName}`;
      setState({ busy }, false);
      try {
        await request(`/api/spaces/${encodeURIComponent(spaceName)}/limits`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        closeModal();
        await refreshAfterMutation();
      } catch (error) {
        showError(error);
      } finally {
        if (state.busy === busy) setState({ busy: null }, false);
      }
    }

    async function toggleSponsor(provider) {
      const current = !!((state.sponsor || {})[provider] || {}).enabled;
      const busy = `sponsor:${provider}`;
      setState({ busy }, false);
      try {
        const sponsor = await request("/api/sponsor", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ provider, enabled: !current })
        });
        setState({ sponsor }, false);
      } catch (error) {
        showError(error);
      } finally {
        if (state.busy === busy) setState({ busy: null }, false);
      }
    }

    async function createSpace() {
      const name = state.newSpace.name.trim();
      if (!name) return showError(new Error(t("Enter a space name.")));
      // The server normalizes the name (e.g. "My Project" -> "my-project") and
      // returns the final name; use that so we select the space that was created.
      setState({ busy: "create" }, false);
      try {
        const created = await request("/api/spaces", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, memory_gb: state.newSpace.memory_gb, cpus: state.newSpace.cpus, template: state.newSpace.template || "" })
        });
        const finalName = (created && created.name) || name;
        setState({
          modal: null,
          busy: null,
          selected: finalName,
          usageSpace: finalName,
          usage: [],
          usageLoading: true,
          confirmRevoke: null
        }, true);
        await refreshOverview(true);
        await loadUsage(name, true);
      } catch (error) {
        setState({ busy: null }, false);
        showError(error);
      }
    }

    async function deleteSpace(spaceName) {
      setState({ busy: `delete:${spaceName}` }, false);
      try {
        await request(`/api/spaces/${encodeURIComponent(spaceName)}`, { method: "DELETE" });
        setState({ modal: null, deleteTarget: null, selected: "all", busy: null, usage: [], usageSpace: null }, true);
        await refreshAfterMutation();
      } catch (error) {
        setState({ busy: null }, false);
        showError(error);
      }
    }

    async function revokeMember(spaceName, memberName) {
      if (state.confirmRevoke !== memberName) {
        setState({ confirmRevoke: memberName }, false);
        return;
      }
      const busy = `revoke:${spaceName}:${memberName}`;
      setState({ busy }, false);
      try {
        await request(`/api/spaces/${encodeURIComponent(spaceName)}/members/${encodeURIComponent(memberName)}`, { method: "DELETE" });
        setState({ confirmRevoke: null, busy: null }, false);
        await refreshAfterMutation();
      } catch (error) {
        setState({ busy: null }, false);
        showError(error);
      }
    }

    async function fetchInvite(spaceName) {
      setState({ modal: "invite", inviteSpace: spaceName, invite: null, inviteLoading: true, invitePlatform: "posix", copied: null }, true);
      try {
        const invite = await request(`/api/spaces/${encodeURIComponent(spaceName)}/invites`, { method: "POST" });
        if (state.modal === "invite" && state.inviteSpace === spaceName) setState({ invite, inviteLoading: false }, true);
      } catch (error) {
        if (state.modal === "invite" && state.inviteSpace === spaceName) setState({ inviteLoading: false }, false);
        showError(error);
      }
    }

    // The public invite page (/i/<code>) only makes sense when the console is
    // reachable beyond this Mac, so the link row hides on localhost.
    function inviteLinkURL(invite) {
      if (!invite || !invite.code) return null;
      const host = location.hostname;
      if (host === "localhost" || host === "127.0.0.1" || host === "::1" || host === "[::1]") return null;
      return `${location.origin}/i/${invite.code}`;
    }

    async function copySSH(spaceName) {
      try {
        await writeClipboard(`ssh ${spaceName}`);
        setState({ copied: "ssh" }, false);
        setTimeout(() => { if (state.copied === "ssh") setState({ copied: null }, false); }, 1800);
      } catch (error) {
        showError(error);
      }
    }

    async function copyInviteLink() {
      const link = inviteLinkURL(state.invite);
      if (!link) return;
      try {
        await writeClipboard(link);
        setState({ copied: "link" }, false);
        setTimeout(() => { if (state.copied === "link") setState({ copied: null }, false); }, 1800);
      } catch (error) {
        showError(error);
      }
    }

    // The daemon owns the install commands (internal/dist) and sends them with
    // each invite, so the console never hard-codes a download location.
    function guestInstallCommand(invite, platform) {
      const install = (invite && invite.install) || {};
      return String((platform === "windows" ? install.windows : install.posix) || "");
    }

    function inviteCommands(invite, platform, spaceName) {
      const pair = invite && String(invite.command || "");
      if (!pair) return [];
      const install = guestInstallCommand(invite, platform);
      // Comment-free so the block pastes cleanly into any shell; the trailing
      // ssh runs last and drops the guest straight into the space.
      return [install, pair, `ssh ${spaceName}`];
    }

    async function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand("copy");
      textarea.remove();
      if (!copied) throw new Error(t("Copy was blocked by the browser."));
    }

    async function copyInvite(which) {
      const commands = inviteCommands(state.invite, state.invitePlatform, state.inviteSpace || "space");
      if (!commands.length) return;
      const text = which === "all" ? commands.join("\n") : commands[Number(which)];
      if (!text) return;
      try {
        await writeClipboard(text);
        setState({ copied: which }, false);
        setTimeout(() => { if (state.copied === which) setState({ copied: null }, false); }, 1800);
      } catch (error) {
        showError(error);
      }
    }

    function closeModal() {
      if (state.busy && state.busy.startsWith("upgrade:")) return;
      setState({
        modal: null,
        invite: null,
        inviteSpace: null,
        inviteLoading: false,
        invitePlatform: "posix",
        copied: null,
        deleteTarget: null,
        busy: state.busy === "create" ? null : state.busy
      }, false);
    }

    app.addEventListener("input", event => {
      if (event.target.id === "new-space-name") setState({ newSpace: { ...state.newSpace, name: event.target.value } }, false);
      if (event.target.id === "new-space-template") setState({ newSpace: { ...state.newSpace, template: event.target.value } }, false);
    });

    app.addEventListener("change", event => {
      if (event.target.dataset.setting) saveCodexSetting(event.target.dataset.space, event.target.dataset.setting, event.target.value);
    });

    app.addEventListener("submit", event => {
      if (event.target.matches('[data-form="create-space"]')) {
        event.preventDefault();
        createSpace();
      } else if (event.target.matches('[data-form="limits"]')) {
        event.preventDefault();
        saveLimits();
      }
    });

    app.addEventListener("keydown", event => {
      const card = event.target.closest('[role="button"][data-action="select-space"]');
      if (card && !event.target.closest("button") && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        card.click();
      }
    });

    app.addEventListener("click", event => {
      const control = event.target.closest("[data-action]");
      if (!control) return;
      const action = control.dataset.action;
      const spaceName = control.dataset.space;
      if (action === "select-all") {
        setState({ selected: "all", confirmRevoke: null }, true);
      } else if (action === "select-space") {
        if (event.target.closest("button") && event.target.closest("button") !== control) return;
        setState({ selected: spaceName, usageSpace: spaceName, usage: [], usageLoading: true, confirmRevoke: null }, true);
        loadUsage(spaceName, true);
      } else if (action === "toggle-space") {
        event.stopPropagation();
        toggleSpace(spaceName);
      } else if (action === "toggle-sponsor") {
        toggleSponsor(control.dataset.provider);
      } else if (action === "toggle-provider") {
        toggleProvider(spaceName, control.dataset.provider);
      } else if (action === "toggle-fullauto") {
        toggleFullAuto(spaceName);
      } else if (action === "toggle-network") {
        toggleNetwork(spaceName);
      } else if (action === "open-network-upgrade") {
        setState({modal: "network-upgrade", upgradeSpace: spaceName}, true);
      } else if (action === "confirm-network-upgrade") {
        upgradeNetwork(spaceName);
      } else if (action === "save-template") {
        saveTemplate(spaceName);
      } else if (action === "delete-template") {
        deleteTemplate(control.dataset.template);
      } else if (action === "open-create" && imageReady()) {
        setState({ modal: "create", newSpace: { name: "", memory_gb: 2, cpus: Math.min(4, (state.host && state.host.cpus) || 4), template: "" }, confirmRevoke: null }, true);
        requestAnimationFrame(() => document.getElementById("new-space-name")?.focus());
      } else if (action === "pick-memory") {
        setState({ newSpace: { ...state.newSpace, memory_gb: Number(control.dataset.memory) } }, false);
      } else if (action === "close-modal") {
        if (event.target !== control && control.classList.contains("modal-backdrop")) return;
        closeModal();
      } else if (action === "open-limits") {
        setState({ modal: "limits", limitsSpace: spaceName }, true);
      } else if (action === "open-invite") {
        fetchInvite(spaceName);
      } else if (action === "retry-invite") {
        fetchInvite(state.inviteSpace);
      } else if (action === "pick-invite-platform") {
        setState({ invitePlatform: control.dataset.platform === "windows" ? "windows" : "posix", copied: null }, false);
      } else if (action === "copy-invite-link") {
        copyInviteLink();
      } else if (action === "copy-invite") {
        copyInvite("all");
      } else if (action === "copy-line") {
        copyInvite(control.dataset.line);
      } else if (action === "delete-space") {
        setState({ modal: "delete", deleteTarget: spaceName, confirmRevoke: null }, true);
      } else if (action === "confirm-delete") {
        deleteSpace(control.dataset.space);
      } else if (action === "copy-ssh") {
        copySSH(spaceName);
      } else if (action === "revoke-member") {
        revokeMember(spaceName, control.dataset.member);
      } else if (action === "dismiss-battery") {
        try { sessionStorage.setItem(batterySessionKey, "1"); } catch (_) {}
        setState({ batteryDismissed: true }, false);
      } else if (action === "close-toast") {
        clearTimeout(toastTimer);
        setState({ toast: null }, false);
      } else if (action === "retry-overview") {
        refreshOverview(true);
      } else if (action === "toggle-lang") {
        setLang(lang === "zh" ? "en" : "zh");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && state.modal) closeModal();
    });

    render();
    refreshOverview(true);
    setInterval(() => {
      const editing = document.activeElement?.matches("input, select, textarea");
      if (!state.modal && !state.busy && !editing) refreshOverview();
    }, 5000);
  </script>
</body>
</html>

# Builds the space base image for linux/arm64 (Apple container hosts) and
# linux/amd64 (x86 hosts) and pushes it to ghcr.io under internal/dist
# BaseImage. Run it with scripts/publish-image.sh (or from the Actions tab).
# A published tag is the image that daemon release was tested with, so an
# existing tag is never overwritten unless "force" is set — bump the tag in
# internal/dist instead.
name: space-image

on:
  workflow_dispatch:
    inputs:
      force:
        description: Overwrite the tag if it already exists
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read the image ref
        id: ref
        run: |
          ref=$(sed -n 's/.*BaseImage = "\(.*\)"/\1/p' internal/dist/dist.go)
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published tag
        if: ${{ !inputs.force }}
        run: |
          if docker buildx imagetools inspect "${{ steps.ref.outputs.ref }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.ref.outputs.ref }} already exists — bump BaseImage in internal/dist, or re-run with force"
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: image
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ref.outputs.ref }}
